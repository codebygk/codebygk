[constellation]
user             = "codebygk"
source           = "github"      # "github" = fetch live, "manual" = use [[repo]] entries below
max_repos        = 20            # most active repos win
max_per_theme    = 7
include_forks    = false
include_archived = false
exclude          = ["codebygk"]  # your profile repo is always skipped too
other_name       = "Experiments" # cluster for repos that match no theme

[[theme]]
name     = "Handbooks"
color    = "#2dd4bf"
repos    = ["playwright-handbook", "test-automation-handbook"]
topics   = ["handbook", "interview", "notes", "cheatsheet"]
keywords = ["handbook", "interview questions", "cheatsheet"]

[[theme]]
name     = "Tools & Apps"
color    = "#f5c542"
topics   = ["tool", "cli", "chrome-extension", "nextjs"]
keywords = ["extension", "generator", "crawler", "cli", "app", "tool"]

[[theme]]
name     = "AI & Evals"
color    = "#a78bfa"
topics   = ["llm", "ai", "rag", "evals", "genai"]
keywords = ["llm", "rag", "eval", "prompt"]

[[theme]]
name     = "Security"
color    = "#fb7185"
topics   = ["security", "bug-bounty", "cybersecurity", "osint"]
keywords = ["bug bounty", "security", "dork"]

# Manual mode example (set source = "manual" above):
