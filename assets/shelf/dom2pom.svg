<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="DOM2POM: Generates Page Object Models from a live DOM (live)">
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="298" height="198" rx="12"/></clipPath>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>text { font-family: 'JetBrains Mono','Fira Code',Menlo,Consolas,monospace; }</style>

  <rect x="1" y="1" width="298" height="198" rx="12" fill="#0f172a" stroke="#1b2740" stroke-width="2"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="300" height="5" fill="#f5c542"/>
    <rect x="-90" y="0" width="90" height="5" fill="url(#sweep)">
      <animate attributeName="x" values="-90;300" dur="3.2s" begin="0.45s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="24" y="38" style="font-size:11px;letter-spacing:2px;fill:#f5c542">CHROME EXTENSION</text>
  <text x="24" y="72" style="font-size:22.0px;font-weight:700;fill:#e6edf7">DOM2POM</text>
  <text x="24" y="102" style="font-size:12px;fill:#9fb0c8">Generates Page Object Models from</text><text x="24" y="120" style="font-size:12px;fill:#9fb0c8">a live DOM</text>
  <rect x="24.0" y="132" width="65.6" height="20" rx="10" fill="#f5c542" fill-opacity="0.12" stroke="#f5c542" stroke-opacity="0.5"/><text x="56.8" y="146" text-anchor="middle" style="font-size:11px;fill:#f5c542">Testing</text><rect x="97.6" y="132" width="86.0" height="20" rx="10" fill="#f5c542" fill-opacity="0.12" stroke="#f5c542" stroke-opacity="0.5"/><text x="140.6" y="146" text-anchor="middle" style="font-size:11px;fill:#f5c542">Playwright</text><rect x="191.6" y="132" width="72.4" height="20" rx="10" fill="#f5c542" fill-opacity="0.12" stroke="#f5c542" stroke-opacity="0.5"/><text x="227.8" y="146" text-anchor="middle" style="font-size:11px;fill:#f5c542">Selenium</text>

  <line x1="24" y1="164" x2="276" y2="164" stroke="#1b2740"/>
  <circle cx="30" cy="180" r="5" fill="#22c55e"/><circle cx="30" cy="180" r="5" fill="none" stroke="#22c55e" stroke-width="2" opacity="0"><animate attributeName="r" values="5;14;14" keyTimes="0;0.6;1" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.6;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="46" y="185" style="font-size:12px;font-weight:700;letter-spacing:1px;fill:#22c55e">LIVE</text>
  <text x="276" y="185" text-anchor="end" style="font-size:12px;fill:#f5c542">open ↗</text>
</svg>
